name: Static checks

on:
  pull_request:
  push:
    branches:
      - main

# Untrusted changes receive no repository or OIDC token permissions.
permissions: {}

concurrency:
  group: static-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_SESSION_TOKEN: ""
  AWS_EC2_METADATA_DISABLED: "true"
  AWS_PAGER: ""

jobs:
  go:
    name: Go unit, race, and vet
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up reviewed Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.26.2
          cache: true
      - name: Run Go unit and controller integration, conformance, and resilience tests
        run: go test ./...
      - name: Run Go race detector
        run: go test -race ./...
      - name: Run Go vet
        run: go vet ./...

  python:
    name: Python, controller, and documentation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up reviewed Go for controller artifacts
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.26.2
          cache: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Compile and test Python tooling
        run: |
          python3 -m compileall -q scripts
          python3 scripts/test_aws_appliance.py
          python3 scripts/test_aws_two_region_e2e.py
          python3 scripts/test_aws_production_controller_e2e.py
          python3 scripts/test_terraform_contract.py
          python3 scripts/test_artifacts.py
          python3 scripts/test_transport_router_readiness.py
          python3 scripts/test_symmetric_gwlb_ha.py
      - name: Verify controller Terraform and systemd contracts
        run: |
          python3 scripts/test_controller_terraform.py
          python3 scripts/test_controller_systemd.py
      - name: Verify controller artifact reproducibility
        run: python3 scripts/test_controller_artifacts.py
      - name: Validate documentation contracts
        run: python3 scripts/test_docs.py

  linux-integration:
    name: Privileged Linux and Headscale integration
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions: {}
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up reviewed Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.26.2
          cache: true
      - name: Install privileged test prerequisites
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iproute2 >/dev/null
          go mod download
      - name: Run privileged app and datapath integration tests
        timeout-minutes: 10
        run: >-
          sudo env "PATH=$PATH" "HOME=$HOME" "GOMODCACHE=$(go env GOMODCACHE)"
          "GOCACHE=$RUNNER_TEMP/envelope-go-root-cache" go test -tags=integration
          -count=1 -timeout=8m ./internal/app ./internal/datapath
      - name: Run packet-turnaround component wire smoke
        timeout-minutes: 5
        run: >-
          sudo env "PATH=$PATH" "HOME=$HOME" "GOMODCACHE=$(go env GOMODCACHE)"
          "GOCACHE=$RUNNER_TEMP/envelope-go-root-cache" ./scripts/component_wire_smoke.sh
      - name: Verify rendered systemd units
        timeout-minutes: 8
        run: python3 scripts/verify_systemd_units.py
      - name: Run pinned secretless Headscale integration
        timeout-minutes: 25
        run: ./scripts/integration_headscale_two_peer.sh
      - name: Install native attestor kernel test prerequisites
        run: sudo apt-get install -y -qq iptables nftables util-linux >/dev/null
      - name: Verify native attestor kernel inspection in an isolated namespace
        timeout-minutes: 8
        run: >-
          sudo env "PATH=$PATH" "HOME=$HOME" "GOMODCACHE=$(go env GOMODCACHE)"
          "GOCACHE=$RUNNER_TEMP/envelope-go-root-cache" bash ./scripts/integration_router_attestor.sh

  terraform:
    name: Terraform 1.10.5
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Run isolated appliance and controller Terraform checks
        env:
          TERRAFORM_BIN: terraform
        run: ./scripts/test_terraform.sh

  openspec:
    name: OpenSpec strict validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.0
      - name: Install pinned OpenSpec
        run: npm install --global --ignore-scripts --no-audit --no-fund @fission-ai/openspec@1.1.0
      - name: Validate all OpenSpec changes and specs
        run: openspec validate --all --strict --no-interactive

  repository-safety:
    name: Shell and secret checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Validate shell syntax
        run: bash -n scripts/*.sh
      - name: Scan tracked and non-ignored source
        run: python3 scripts/secret_scan.py --root .
