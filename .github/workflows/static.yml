name: Static checks

on:
  pull_request:
  push:
    branches:
      - main

# Untrusted changes receive no repository or OIDC token permissions.
permissions: {}

concurrency:
  group: static-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  AWS_EC2_METADATA_DISABLED: "true"
  AWS_PAGER: ""

jobs:
  go:
    name: Go unit, race, and vet
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up reviewed Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.26.2
          cache: true
      - name: Run Go checks
        run: |
          go test ./...
          go test -race ./...
          go vet ./...

  python:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Compile and test Python
        run: |
          python3 -m compileall -q scripts
          python3 scripts/test_aws_appliance.py
          python3 scripts/test_aws_two_region_e2e.py
          python3 scripts/test_terraform_contract.py
          python3 scripts/test_artifacts.py

  terraform:
    name: Terraform 1.10.5
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Run isolated Terraform checks
        env:
          TERRAFORM_BIN: terraform
        run: ./scripts/test_terraform.sh

  openspec:
    name: OpenSpec strict validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.0
      - name: Install pinned OpenSpec
        run: npm install --global --ignore-scripts --no-audit --no-fund @fission-ai/openspec@1.1.0
      - name: Validate all OpenSpec changes and specs
        run: openspec validate --all --strict --no-interactive

  repository-safety:
    name: Shell and secret checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Validate shell syntax
        run: bash -n scripts/*.sh
      - name: Scan tracked and non-ignored source
        run: python3 scripts/secret_scan.py --root .
