name: Protected split controller acceptance
run-name: Controller acceptance ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Unique lowercase run ID
        required: true
        type: string
      approved_run_id:
        description: Retype the run ID to approve billable execution
        required: true
        type: string

permissions: {}
concurrency:
  group: envelope-two-region-e2e-live
  cancel-in-progress: false

env:
  AWS_EC2_METADATA_DISABLED: "true"
  AWS_PAGER: ""
  ENVELOPE_E2E_APPROVED_RUN_ID: ${{ inputs.approved_run_id }}
  GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
  GITHUB_HEAD_REPO_FORK: "false"
  RUN_ID: ${{ inputs.run_id }}

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require protected ref and exact approval
        env:
          APPROVED: ${{ inputs.approved_run_id }}
          IS_FORK: ${{ github.event.repository.fork }}
        run: |
          set -euo pipefail
          [[ "$IS_FORK" == false && "$GITHUB_REF_PROTECTED" == true ]]
          [[ "$RUN_ID" =~ ^[a-z][a-z0-9-]{2,17}[a-z0-9]$ ]]
          [[ "$APPROVED" == "$RUN_ID" ]]

  deploy:
    needs: authorize
    environment: envelope-controller-deployment
    runs-on:
      group: envelope-production-deployment
      labels: [self-hosted, linux, x64]
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    outputs:
      handoff: ${{ steps.deploy.outputs.handoff }}
      observe_role: ${{ steps.deploy.outputs.observe_role }}
      quiesce_role: ${{ steps.deploy.outputs.quiesce_role }}
      integration: ${{ steps.integration.outputs.report }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          clean: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.26.2
          cache: true
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Create a new private invocation directory
        env:
          TEMPLATE_B64: ${{ secrets.ENVELOPE_PRODUCTION_CONTROLLER_SPLIT_CONFIG_TEMPLATE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          [[ ! -L .run ]]
          mkdir -p .run
          mkdir ".run/$RUN_ID"
          printf '%s' "$TEMPLATE_B64" | base64 --decode > ".run/$RUN_ID/template.json"
          python3 scripts/aws_controller_acceptance.py prepare-config \
            --template ".run/$RUN_ID/template.json" --run-id "$RUN_ID" \
            --output ".run/$RUN_ID/split-config.json"
      - name: Record integration-only deterministic evidence
        id: integration
        run: |
          set -euo pipefail
          go test -count=1 -json ./internal/controller/integration > ".run/$RUN_ID/integration.jsonl"
          python3 scripts/aws_controller_acceptance.py record-integration \
            --input ".run/$RUN_ID/integration.jsonl" --revision "$GITHUB_SHA" \
            --output ".run/$RUN_ID/integration.json"
          printf 'report=%s\n' "$(jq -c . ".run/$RUN_ID/integration.json")" >> "$GITHUB_OUTPUT"
      - name: Deploy production dependencies and revoke deployment authority
        id: deploy
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_CLIENT_SECRET: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          ENVELOPE_CONTROLLER_TSNET_AUTH_KEY: ${{ secrets.ENVELOPE_CONTROLLER_TSNET_AUTH_KEY }}
          ENVELOPE_CONTROLLER_ADMIN_API_KEY: ${{ secrets.ENVELOPE_CONTROLLER_ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/aws_controller_acceptance.py deploy \
            --config ".run/$RUN_ID/split-config.json" --directory ".run/$RUN_ID/deploy" \
            --reference ".run/$RUN_ID/handoff-ref.json"
          printf 'handoff=%s\n' "$(jq -c . ".run/$RUN_ID/handoff-ref.json")" >> "$GITHUB_OUTPUT"
          printf 'observe_role=%s\n' "$(jq -r .observe ".run/$RUN_ID/deploy/phase-roles.json")" >> "$GITHUB_OUTPUT"
          printf 'quiesce_role=%s\n' "$(jq -r .quiesce ".run/$RUN_ID/deploy/phase-roles.json")" >> "$GITHUB_OUTPUT"
      - name: Retain failed deployment forensic pointer
        if: failure()
        run: |
          set -euo pipefail
          if [[ -f ".run/$RUN_ID/deploy/failure.json" ]]; then
            python3 scripts/secret_scan.py --root . --extra ".run/$RUN_ID/deploy/failure.json"
          fi
          printf 'Private recovery state and claims are retained; do not reuse this run ID.\n'

  observe:
    needs: deploy
    environment: envelope-controller-observation
    # This group must be isolated from deployment hosts, disks, and process namespaces.
    runs-on:
      group: envelope-production-observation
      labels: [self-hosted, linux, x64]
    timeout-minutes: 65
    permissions:
      contents: read
      id-token: write
    outputs:
      live: ${{ steps.measure.outputs.live }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          clean: false
      - name: Measure under the exact route-denied observation identity
        id: measure
        env:
          HANDOFF: ${{ needs.deploy.outputs.handoff }}
          ROLE: ${{ needs.deploy.outputs.observe_role }}
        run: |
          set -uo pipefail
          umask 077
          [[ ! -L .run ]] || exit 1
          mkdir -p .run
          mkdir ".run/$RUN_ID" || exit 1
          printf '%s' "$HANDOFF" > ".run/$RUN_ID/handoff-ref.json"
          status=0
          python3 scripts/aws_controller_acceptance.py observe \
            --handoff-reference ".run/$RUN_ID/handoff-ref.json" --role-arn "$ROLE" \
            --directory ".run/$RUN_ID/observe" --reference ".run/$RUN_ID/live-ref.json" || status=$?
          if [[ -f ".run/$RUN_ID/live-ref.json" ]]; then
            printf 'live=%s\n' "$(jq -c . ".run/$RUN_ID/live-ref.json")" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
      - name: Scan retained observation evidence
        if: always()
        run: |
          set -euo pipefail
          if [[ -f ".run/$RUN_ID/observe/live.json" ]]; then
            python3 scripts/secret_scan.py --root . --extra ".run/$RUN_ID/observe/live.json"
          fi

  quiesce:
    needs: [deploy, observe]
    if: always() && needs.deploy.result == 'success'
    environment: envelope-controller-quiescence
    runs-on:
      group: envelope-production-deployment
      labels: [self-hosted, linux, x64]
    timeout-minutes: 110
    permissions:
      contents: read
      id-token: write
    outputs:
      proof: ${{ steps.quiesce.outputs.proof }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          clean: false
      - name: Expire observer authority and prove stopped/drained controllers
        id: quiesce
        env:
          HANDOFF: ${{ needs.deploy.outputs.handoff }}
          ROLE: ${{ needs.deploy.outputs.quiesce_role }}
        run: |
          set -euo pipefail
          umask 077
          [[ ! -L .run ]]
          mkdir -p ".run/$RUN_ID"
          printf '%s' "$HANDOFF" > ".run/$RUN_ID/quiesce-handoff-ref.json"
          python3 scripts/aws_controller_acceptance.py quiesce \
            --handoff-reference ".run/$RUN_ID/quiesce-handoff-ref.json" --role-arn "$ROLE" \
            --directory ".run/$RUN_ID/quiesce" --reference ".run/$RUN_ID/quiescence-ref.json"
          printf 'proof=%s\n' "$(jq -c . ".run/$RUN_ID/quiescence-ref.json")" >> "$GITHUB_OUTPUT"

  cleanup:
    needs: [deploy, observe, quiesce]
    if: always() && needs.quiesce.result == 'success'
    environment: envelope-controller-cleanup
    runs-on:
      group: envelope-production-deployment
      labels: [self-hosted, linux, x64]
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          clean: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.26.2
          cache: true
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Recheck quiescence before acquiring cleanup credentials
        env:
          HANDOFF: ${{ needs.deploy.outputs.handoff }}
          QUIESCENCE: ${{ needs.quiesce.outputs.proof }}
          LIVE: ${{ needs.observe.outputs.live }}
          INTEGRATION: ${{ needs.deploy.outputs.integration }}
          ROLE: ${{ needs.deploy.outputs.quiesce_role }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_CLIENT_SECRET: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          [[ ! -L .run ]]
          mkdir -p ".run/$RUN_ID"
          printf '%s' "$HANDOFF" > ".run/$RUN_ID/cleanup-handoff-ref.json"
          printf '%s' "$QUIESCENCE" > ".run/$RUN_ID/cleanup-quiescence-ref.json"
          printf '%s' "$INTEGRATION" > ".run/$RUN_ID/cleanup-integration.json"
          args=()
          if [[ -n "$LIVE" ]]; then
            printf '%s' "$LIVE" > ".run/$RUN_ID/cleanup-live-ref.json"
            args+=(--live-reference ".run/$RUN_ID/cleanup-live-ref.json")
          fi
          python3 scripts/aws_controller_acceptance.py cleanup \
            --handoff-reference ".run/$RUN_ID/cleanup-handoff-ref.json" --role-arn "$ROLE" \
            --quiescence-reference ".run/$RUN_ID/cleanup-quiescence-ref.json" \
            --integration ".run/$RUN_ID/cleanup-integration.json" "${args[@]}" \
            --directory ".run/$RUN_ID/cleanup" --reference ".run/$RUN_ID/bundle-ref.json"
      - name: Scan sanitized bundle before upload
        id: scan
        if: always()
        run: |
          set -euo pipefail
          [[ -f ".run/$RUN_ID/cleanup/bundle.json" && ! -L ".run/$RUN_ID/cleanup/bundle.json" ]]
          python3 scripts/secret_scan.py --root . --extra ".run/$RUN_ID/cleanup/bundle.json"
          printf 'safe=true\n' >> "$GITHUB_OUTPUT"
      - name: Retain sanitized live/integration/cleanup evidence
        if: always() && steps.scan.outputs.safe == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: controller-acceptance-${{ inputs.run_id }}
          path: .run/${{ inputs.run_id }}/cleanup/bundle.json
          if-no-files-found: error
          retention-days: 14
      # No blanket rm/git-clean: failed or interrupted cleanup retains claims,
      # local evidence, and encrypted private recovery snapshots for inspection.
