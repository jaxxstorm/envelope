schema: spec-driven

context: |
  Project: Envelope
  Purpose: A lightweight AWS Gateway Load Balancer (GWLB) packet-turnaround target. For each valid GENEVE packet on
  UDP/6081, Envelope immediately returns exactly one packet to that GWLB with byte-identical inner data and the current
  packet's outer tuple, VNI, ordered options, and flow cookie. Separate Tailscale transport routers carry inspected inner
  traffic between sites; Envelope targets do not inject into a TUN or directly forward inner packets.

  Tech stack:
  - Language: Go (preferred) with no cgo/c bindings.
  - OS: Linux only (initially).
  - Tailscale integration:
    - Dedicated transport-router hosts own tailscale0, exact route advertisements, accepted routes, no-NAT forwarding,
      firewall policy, and MSS clamping.
    - Envelope targets do not run tailscaled, create envelope0, or carry inner site routes.
  - AWS: Targets sit behind GWLB; GWLBE post-inspection route tables select VPC local delivery or a ready same-site
    transport-router ENI.

  Networking conventions & assumptions:
  - GENEVE runs over UDP/6081.
  - Inner payload is treated as L3 IP packets; targets do not perform L2 bridging.
  - Target processing is packet-scoped and stateless across packets; invalid packets produce no return.
  - Inter-site transport preserves source addresses and performs no conntrack or NAT.
  - Target receive bounds and transport-router path MTU/MSS are separate operational contracts.

  Performance goals:
  - Keep target datapath minimal: UDP receive -> validate GENEVE/AWS metadata -> build one raw IPv4/UDP return -> send.
  - Prefer batching and buffer pooling (sync.Pool) to reduce allocations and GC pressure.
  - Benchmark packet construction and GENEVE option validation without restoring routing-manager benchmarks.

  Observability:
  - Structured logs (zap-style or slog), no noisy debug by default.
  - Prometheus metrics on :9090/metrics and health endpoint :9090/healthz.
  - Include packet receive/return, profile rejection, boundary drop, MTU drop, send failure, and target-component readiness
    metrics. Transport-router, Tailnet, AWS route, and ENI readiness is collected separately by protected acceptance.

  Repo expectations:
  - Specs are the source of truth; code and tests must trace back to specs and acceptance criteria.
  - Prefer small, incremental changes with explicit non-goals and failure-mode analysis.

rules:
  specs:
    - Use clear headings: Goals, Non-goals, Architecture, Interfaces, Data plane, Control plane, Failure modes, Testing.
    - Include an explicit "Return path & symmetry" section (GWLB expectations).
    - State MTU strategy and fragmentation behavior explicitly.
    - Keep each spec focused; split when it exceeds ~2-3 pages.

  proposal:
    - Keep proposals under 800 words.
    - Must include: Motivation, Proposed design, Alternatives considered, Risks, Rollout plan.
    - Must call out whether the change impacts datapath (hot path) and expected perf impact.

  tasks:
    - Break work into chunks <= 2 hours where possible.
    - Each task must include: acceptance check, test plan, and a link/reference to the governing spec section.
    - Include at least one task for observability/metrics for any dataplane feature.

  code:
    - No cgo by default; if required, justify in the proposal and provide a fallback.
    - Avoid global allocations on the hot path; use buffer pools.
    - Prefer x/sys/unix for performance-critical socket options and (optional) recvmmsg/sendmmsg.
    - Include integration tests using pcap fixtures and/or a dockerized replay harness.
    - keep the main.go relatively simple, delegating to well-structured packages.

  tests:
    - Must include:
      - Unit tests for GENEVE header parsing/serialization (with fuzz targets if practical).
      - Packet-level test: valid UDP/6081 ingress -> exactly one byte-identical packet-scoped GWLB return.
      - Negative packet-level test: malformed AWS/GENEVE metadata -> no return.
      - Secretless two-site Headscale integration with separate packet-turnaround targets and transport routers.
    - Provide pcap fixtures for at least:
      - minimal GENEVE packet
      - packet with options (GWLB relevant TLVs if used)
      - oversize packet to validate MTU handling behavior

  libraries:
    - Use alecthomas/kong for CLI and env var parsing.
    - use zap for structured logging

  docs:
    - README must include:
      - What Envelope is / is not
      - Packet-turnaround target and separate transport-router roles
      - Required Linux capabilities, host sysctls, firewall, and protected-readiness ownership
      - MTU guidance and troubleshooting steps
    - Avoid marketing language; keep it operational and precise.
